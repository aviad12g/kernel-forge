[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openkernelforge"
version = "0.1.0"
description = "Open research harness for verifier-guided GPU kernel generation and optimization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.16", "mypy>=2.3"]
triton = ["triton"]
llm = ["requests>=2.31"]
paper = ["matplotlib>=3.7", "Pillow>=10", "pypdf>=4", "reportlab>=4"]

[project.scripts]
openkernelforge = "openkernelforge.cli:main"

[tool.setuptools.packages.find]
include = ["openkernelforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
