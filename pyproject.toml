[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openkernelforge"
version = "0.1.0"
description = "Open research harness for verifier-guided GPU kernel generation and optimization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
triton = ["triton"]

[project.scripts]
openkernelforge = "openkernelforge.cli:main"

[tool.setuptools.packages.find]
include = ["openkernelforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
