tasks: []
output_dir: runs
kernelbench:
  max_tasks: 20
  candidate_provider: gemini
  candidates_per_task: 1
  stratify_by_family: true
  record_skipped_tasks: true
  max_numel_per_input: null
  max_total_input_bytes: null
  skip_if_estimated_memory_gt_mb: 3072
agent:
  type: llm
  backend: openai_compatible
  model: gemini-3.1-flash-lite
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  api_key_env: GEMINI_API_KEY
  max_attempts: 1
  candidates_per_attempt: 1
  stop_after_first_correct: false
  benchmark_all_correct: true
  allow_torch_fallback: false
  temperature: 0.2
  top_p: 0.95
  max_tokens: 4096
  timeout_seconds: 120
  performance_search:
    enabled: false
benchmark:
  enabled: true
  timing_mode: cuda_event
  warmup: 30
  repeat: 120
  independent_sessions: 3
  device: auto
  include_torch_compile: true
  torch_compile_mode: max-autotune
  cache_flush:
    enabled: true
    size_mb: 128
    mode: write
  bootstrap_ci:
    enabled: true
    samples: 1000
    seed: 123
  separate_compile_time: true
execution:
  require_cuda: true
  require_triton: true
  require_tiny_triton_kernel: true
