study:
  id: workshop2026_near_threshold_multiplicity_v1
  purpose: calibrated_near_threshold_selection_multiplicity
  status: preregistered_pending_gpu_execution

tasks:
  ids: [bias_relu, residual_add_relu, bias_gelu, rmsnorm_small]
  shape_regime: [4096, 1024]
  dtype: float32

candidates:
  source: deterministic_fused8_templates_with_discarded_triton_copy_work
  variants_per_task: 20
  selected_candidates_per_task: 12
  freeze_pool_before_calibration: true
  freeze_subset_before_primary_timing: true
  allowed_manifest_statuses:
    - FROZEN_BEFORE_ANY_TIMING
    - FROZEN_AFTER_DISJOINT_CALIBRATION_BEFORE_PRIMARY_TIMING
  historical_design_prior:
    protocol: configs/workshop2026_multiplicity_protocol.yaml
    manifest: artifacts/workshop2026/multiplicity/candidate_manifest.json
    timing_blocks: artifacts/workshop2026/multiplicity/campaign/all_candidate_timing_blocks.csv
    phase: confirmation
  base_candidates:
    bias_relu: template_00
    residual_add_relu: template_14
    bias_gelu: template_06
    rmsnorm_small: template_03
  delay_work_units:
    bias_relu: [0.250, 0.375, 0.500, 0.625, 0.750, 0.875, 1.000, 1.125, 1.250, 1.375, 1.500, 1.625, 1.750, 1.875, 2.000, 2.125, 2.250, 2.375, 2.500, 2.625]
    residual_add_relu: [1.000, 1.200, 1.400, 1.600, 1.800, 2.000, 2.200, 2.400, 2.600, 2.800, 3.000, 3.200, 3.400, 3.600, 3.800, 4.000, 4.200, 4.400, 4.600, 4.800]
    bias_gelu: [2.500, 2.700, 2.900, 3.100, 3.300, 3.500, 3.700, 3.900, 4.100, 4.300, 4.500, 4.700, 4.900, 5.100, 5.300, 5.500, 5.700, 5.900, 6.100, 6.300]
    rmsnorm_small: [1.750, 1.950, 2.150, 2.350, 2.550, 2.750, 2.950, 3.150, 3.350, 3.550, 3.750, 3.950, 4.150, 4.350, 4.550, 4.750, 4.950, 5.150, 5.350, 5.550]
  delay_kernel:
    block_size: 256
    num_warps: 4
    semantics: discarded_copy_of_first_tensor_input

correctness:
  seeds: [1103, 2207, 3301, 4409, 5519]
  same_input_repeat_executions: 2
  require_deterministic_repeat: true
  require_exact_output_tree: true
  require_alias_contract: true

calibration:
  fresh_processes: 3
  process_seed_base: 82001
  paired_blocks_per_process: 10
  excluded_from_primary_analysis: true
  selection_window_speedup: [0.98, 1.04]
  selection_rule: within_window_then_closest_absolute_log_distance

screening:
  processes: 1
  process_seed: 91041
  paired_blocks: 20

confirmation:
  fresh_processes: 7
  process_seed_base: 101071
  paired_blocks_per_process: 20
  minimum_screen_to_confirmation_minutes: 30
  timing: cuda_event
  minimum_interval_ms: 1.5
  warmup_launches: 30
  cache_state_perturbation:
    l2_multiplier: 2.0
    minimum_size_mb: 32
    maximum_size_mb: 512
    mode: read_write

analysis:
  candidate_budgets: [1, 2, 3, 5, 8, 12]
  resamples: 4000
  bootstrap_samples: 4000
  seed: 72091
  practical_speedup_margin: 0.02
  confirmation_estimate: median_of_process_block_medians
  all_selected_candidates_require_independent_confirmation: true
  primary_outcomes: [apparent_win_rate, confirmed_win_rate, selection_optimism]

environment:
  precision:
    allow_tf32_matmul: true
    allow_tf32_cudnn: true
    float32_matmul_precision: high

budget:
  maximum_recorded_gpu_worker_hours: 5.0
  stop_before_starting_job_if_cap_reached: true

artifacts:
  candidate_pool_manifest: artifacts/workshop2026/near_threshold_multiplicity/candidate_pool_manifest.json
  selected_manifest: artifacts/workshop2026/near_threshold_multiplicity/selected_candidate_manifest.json
  output_dir: artifacts/workshop2026/near_threshold_multiplicity/campaign
  write_sha256_manifest: true
