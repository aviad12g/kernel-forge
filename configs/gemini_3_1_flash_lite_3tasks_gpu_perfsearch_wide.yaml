tasks:
  - vector_add
  - relu
  - bias_relu
output_dir: runs
execution:
  require_cuda: true
  require_triton: true
  require_tiny_triton_kernel: true
agent:
  type: llm
  backend: openai_compatible
  model: gemini-3.1-flash-lite
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  api_key_env: GEMINI_API_KEY
  max_attempts: 2
  candidates_per_attempt: 4
  stop_after_first_correct: false
  benchmark_all_correct: true
  temperature: 0.5
  top_p: 0.95
  max_tokens: 4096
  timeout_seconds: 120
  allow_torch_fallback: false
  prompt_version: v2_task_skeletons
  repair_prompt_version: v3_cuda_repair
  performance_prompt_version: v1_cuda_elementwise_perf
  performance_search:
    enabled: true
    max_rounds: 4
    candidates_per_round: 6
    target_speedup_vs_eager: 1.0
    target_speedup_vs_compile: null
    keep_top_k: 3
    optimize_only_selected_best: true
verification:
  seeds: [0, 1]
  dtype: float32
  device: auto
  max_shapes_per_task: 1
benchmark:
  enabled: true
  warmup: 10
  repeat: 50
  dtype: float32
  device: auto
  max_shapes_per_task: 1
  enable_torch_compile: false
