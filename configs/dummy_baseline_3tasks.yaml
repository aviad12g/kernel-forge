tasks:
  - vector_add
  - relu
  - bias_relu
output_dir: runs
agent:
  type: dummy
  backend: fake
  max_attempts: 1
  candidates_per_attempt: 1
  stop_after_first_correct: true
  benchmark_all_correct: true
  temperature: 0.2
  allow_torch_fallback: true
verification:
  seeds: [0, 1]
  dtype: float32
  device: auto
  max_shapes_per_task: 1
benchmark:
  enabled: true
  warmup: 10
  repeat: 50
  dtype: float32
  device: auto
  max_shapes_per_task: 1
  enable_torch_compile: false
