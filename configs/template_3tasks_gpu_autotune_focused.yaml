tasks:
  - vector_add
  - relu
  - bias_relu
output_dir: runs
execution:
  require_cuda: true
  require_triton: true
  require_tiny_triton_kernel: true
agent:
  type: template
  backend: fake
  allow_torch_fallback: false
  benchmark_all_correct: true
  template_family: elementwise
  template_variants:
    generation_stage: template_focused_sweep
    focused_seed_run: /workspace/openkernelforge/runs/20260519_204402
    focused_seed_candidates:
      vector_add: /workspace/openkernelforge/runs/20260519_204402/candidates/vector_add/candidate_120.py
      relu: /workspace/openkernelforge/runs/20260519_203234/candidates/relu/candidate_020.py
      bias_relu: /workspace/openkernelforge/runs/20260519_204402/candidates/bias_relu/candidate_252.py
    max_variants_per_task: 500
    grid_sampling: exhaustive_if_under_cap
    sort_order: mixed
    per_task:
      vector_add:
        block_sizes: [32, 48, 64, 96, 128, 192, 256]
        num_warps: [1, 2, 4]
        num_stages: [2, 3, 4]
        contiguous_policies: ["none", "assume_contiguous_no_call"]
        output_allocation_policies: ["torch.empty"]
        n_elements_modes: ["constexpr", "runtime"]
        feature_dim_modes: ["generic"]
      relu:
        block_sizes: [32, 48, 64, 96, 128, 192, 256, 512]
        num_warps: [1, 2, 4]
        num_stages: [2, 3, 4]
        contiguous_policies: ["none", "assume_contiguous_no_call"]
        output_allocation_policies: ["torch.empty", "torch.empty_like"]
        n_elements_modes: ["constexpr", "runtime"]
        feature_dim_modes: ["generic"]
      bias_relu:
        block_sizes: [32, 48, 64, 96, 128, 192, 256]
        num_warps: [1, 2, 4]
        num_stages: [3, 4, 5]
        contiguous_policies: ["none", "assume_contiguous_no_call", "wrapper_contiguous"]
        output_allocation_policies: ["torch.empty"]
        n_elements_modes: ["constexpr", "runtime"]
        feature_dim_modes: ["constexpr", "runtime"]
verification:
  seeds: [0, 1]
  dtype: float32
  device: auto
  max_shapes_per_task: 1
benchmark:
  enabled: true
  warmup: 10
  repeat: 50
  dtype: float32
  device: auto
  max_shapes_per_task: 1
  include_torch_compile: true
