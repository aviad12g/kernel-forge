tasks:
  - vector_add
  - relu
  - bias_relu
output_dir: runs
execution:
  require_cuda: true
  require_triton: true
  require_tiny_triton_kernel: true
agent:
  type: llm
  backend: openai_compatible
  model: qwen3-coder
  base_url: http://localhost:8000/v1
  api_key_env: OPENAI_API_KEY
  max_attempts: 3
  candidates_per_attempt: 2
  stop_after_first_correct: true
  benchmark_all_correct: true
  temperature: 0.2
  top_p: 0.95
  max_tokens: 4096
  timeout_seconds: 120
  allow_torch_fallback: false
verification:
  seeds: [0, 1]
  dtype: float32
  device: auto
  max_shapes_per_task: 1
benchmark:
  enabled: true
  warmup: 10
  repeat: 50
  dtype: float32
  device: auto
  max_shapes_per_task: 1
  enable_torch_compile: false
