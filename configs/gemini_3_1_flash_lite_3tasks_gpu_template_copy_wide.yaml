tasks:
  - vector_add
  - relu
  - bias_relu
output_dir: runs
execution:
  require_cuda: true
  require_triton: true
  require_tiny_triton_kernel: true
agent:
  type: llm
  backend: openai_compatible
  model: gemini-3.1-flash-lite
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  api_key_env: GEMINI_API_KEY
  max_attempts: 1
  candidates_per_attempt: 1
  stop_after_first_correct: false
  benchmark_all_correct: true
  temperature: 0.4
  top_p: 0.95
  max_tokens: 4096
  timeout_seconds: 120
  allow_torch_fallback: false
  prompt_version: v2_task_skeletons
  repair_prompt_version: v3_cuda_repair
  performance_prompt_version: v3_strict_template_copy
  performance_search:
    enabled: true
    mode: template_copy
    include_best_template_context: true
    template_run_dir: runs/<template_run>
    target_speedup_vs_eager: 1.0
    target_speedup_vs_compile: null
    parameter_grid:
      block_sizes: [64, 128, 256, 512, 1024, 2048, 4096]
      num_warps: [4, 8]
      contiguous_policies: ["preserve_template"]
    candidates_per_setting: 2
    max_settings_per_task: 14
  template_copy:
    reject_if_preservation_score_below: 70
    reject_fallbacks: true
    reject_forbidden_torch_ops: true
verification:
  seeds: [0, 1]
  dtype: float32
  device: auto
  max_shapes_per_task: 1
benchmark:
  enabled: true
  warmup: 10
  repeat: 50
  dtype: float32
  device: auto
  max_shapes_per_task: 1
  enable_torch_compile: false
