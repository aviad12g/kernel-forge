tasks:
  - vector_add
  - relu
  - bias_relu
output_dir: runs
execution:
  require_cuda: true
  require_triton: true
  require_tiny_triton_kernel: true
agent:
  type: template
  backend: fake
  allow_torch_fallback: false
  benchmark_all_correct: true
  template_family: elementwise
  template_variants:
    block_sizes: [64, 128, 256, 512, 1024]
    num_warps: [1, 2, 4]
    num_stages: [3, 4]
    contiguous_policies: ["none", "wrapper_contiguous"]
    output_allocation_policies:
      - "torch.empty_like"
      - "torch.empty"
    n_elements_modes: ["runtime"]
    feature_dim_modes: ["generic"]
    max_variants_per_task: 50
    grid_sampling: capped_ordered
    sort_order: mixed
verification:
  seeds: [0, 1]
  dtype: float32
  device: auto
  max_shapes_per_task: 1
benchmark:
  enabled: true
  warmup: 5
  repeat: 20
  dtype: float32
  device: auto
  max_shapes_per_task: 1
  include_torch_compile: false
