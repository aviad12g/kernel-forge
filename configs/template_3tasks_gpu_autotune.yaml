tasks:
  - vector_add
  - relu
  - bias_relu
output_dir: runs
execution:
  require_cuda: true
  require_triton: true
  require_tiny_triton_kernel: true
agent:
  type: template
  backend: fake
  allow_torch_fallback: false
  benchmark_all_correct: true
  template_family: elementwise
  template_variants:
    block_sizes: [128, 256, 512, 1024, 2048]
    num_warps: [4, 8]
    contiguous_policies: ["none", "wrapper_contiguous"]
verification:
  seeds: [0, 1]
  dtype: float32
  device: auto
  max_shapes_per_task: 1
benchmark:
  enabled: true
  warmup: 10
  repeat: 50
  dtype: float32
  device: auto
  max_shapes_per_task: 1
  enable_torch_compile: false
