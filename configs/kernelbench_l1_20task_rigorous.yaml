tasks: []
output_dir: runs
kernelbench:
  max_tasks: 20
  candidate_provider: none
agent:
  type: template
  backend: fake
  benchmark_all_correct: true
  allow_torch_fallback: false
benchmark:
  enabled: true
  timing_mode: cuda_event
  warmup: 30
  repeat: 120
  independent_sessions: 3
  device: auto
  include_torch_compile: true
  cache_flush:
    enabled: true
    size_mb: 128
    mode: write
  bootstrap_ci:
    enabled: true
    samples: 1000
    seed: 123
  separate_compile_time: true
execution:
  require_cuda: true
  require_triton: true
  require_tiny_triton_kernel: true
