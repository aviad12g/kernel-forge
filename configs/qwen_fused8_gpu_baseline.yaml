tasks:
  - bias_relu
  - sigmoid_mul
  - add_relu
  - residual_add_relu
  - bias_gelu
  - row_sum
  - layernorm_small
  - rmsnorm_small
output_dir: runs
execution:
  require_cuda: true
  require_triton: true
  require_tiny_triton_kernel: true
agent:
  type: llm
  backend: openai_compatible
  provider: local_openai_compatible
  api_mode: chat_completions
  model: Qwen/Qwen2.5-Coder-14B-Instruct
  base_url: http://localhost:8000/v1
  api_key_env: OPENAI_API_KEY
  max_attempts: 2
  candidates_per_attempt: 2
  stop_after_first_correct: false
  benchmark_all_correct: true
  temperature: 0.2
  top_p: 0.95
  max_tokens: 4096
  timeout_seconds: 120
  allow_torch_fallback: false
  prompt_version: v2_task_skeletons
  repair_prompt_version: v3_cuda_repair
verification:
  seeds: [0, 1]
  dtype: float32
  device: auto
  max_shapes_per_task: 1
benchmark:
  enabled: true
  warmup: 10
  repeat: 50
  dtype: float32
  device: auto
  max_shapes_per_task: 1
  include_torch_compile: true
